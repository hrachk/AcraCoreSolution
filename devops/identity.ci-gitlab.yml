stages:
- build
- deploy

variables:
# Nexus repo
  NEXUS_HOST: nexus:8123
# Development
  DEV_NETWORK: acra_dev_docker_net
  DEV_IDENTITY: dev-acra-identity/acraidentity
  DEV_IMAGE_IDENTITY: identity-dev
  DEV_PORT_6: 9064
# Production
  PROD_NETWORK: prod_docker_net
  PROD_IDENTITY: prod-acra-identity/acraidentity
  PROD_IMAGE_IDENTITY: identity-prod
  PROD_PORT_6: 9064

  
########### Identity ###########

######## Development ###########
#---------  BUILD  ---------#

acraidentity_dev:
  stage: build
  only:
    - "develop"
  tags:
   - "multirunner-1"
   - docker
  script:
   - sleep 5
   - docker login $NEXUS_HOST -u "$NEXUS_USER" -p "$NEXUS_PASSWORD"
   - docker build -f devops/Dockerfile-IdentityServer . -t $NEXUS_HOST/$DEV_IDENTITY:$CI_PIPELINE_ID
   - docker push $NEXUS_HOST/$DEV_IDENTITY:$CI_PIPELINE_ID

#----------  DEPLOY  ----------#


deploy_identity_dev:
  stage: deploy
  only:
    - "develop"
  tags:
   - "multirunner-1"
   - docker
  needs:
    - acraidentity_dev
  script:
    - |
      sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no devops@$devrunner <<EOF
      docker login $NEXUS_HOST -u "$NEXUS_USER" -p "$NEXUS_PASSWORD"
      docker pull $NEXUS_HOST/$DEV_IDENTITY:$CI_PIPELINE_ID
      docker stop $DEV_IMAGE_IDENTITY || true
      docker rm $DEV_IMAGE_IDENTITY || true
      docker run -d \
      --name $DEV_IMAGE_IDENTITY \
      --network $DEV_NETWORK \
      --restart always \
      -p $DEV_PORT_6:$DEV_PORT_6 \
      -v /etc/localtime:/etc/localtime:ro \
      -v /etc/timezone:/etc/timezone:ro \
      -v /opt/acra/settings/identity-dev/appsettings.json:/app/appsettings.json:ro \
      $NEXUS_HOST/$DEV_IDENTITY:$CI_PIPELINE_ID
      
      echo "Waiting for container to initialize..."
      sleep 10
      if docker ps --format "table {{.Names}}\t{{.Status}}" | grep -q "$DEV_IMAGE_IDENTITY.*Up"; then
        echo "Container $DEV_IMAGE_IDENTITY is running"
        echo "Recent logs:"
        docker logs --tail 20 $DEV_IMAGE_IDENTITY
      else
        echo "Container $DEV_IMAGE_IDENTITY failed to start"
        echo "Container status:"
        docker ps -a --filter name=$DEV_IMAGE_IDENTITY
        echo "Container logs:"
        docker logs $DEV_IMAGE_IDENTITY
        exit 1
      fi
      EOF

########### Production ###########
#---------  BUILD  ---------#

acraidentity_prod:
  stage: build
  only:
    - "master"
  tags:
   - "multirunner-1"
   - docker
  script:
   - sleep 5
   - docker login $NEXUS_HOST -u "$NEXUS_USER" -p "$NEXUS_PASSWORD"
   - docker build -f devops/Dockerfile-IdentityServer . -t $NEXUS_HOST/$PROD_IDENTITY:$CI_PIPELINE_ID
   - docker push $NEXUS_HOST/$PROD_IDENTITY:$CI_PIPELINE_ID

#----------  DEPLOY  ----------#


deploy_identity_prod:
  stage: deploy
  only:
    - "master"
  tags:
   - "multirunner-1"
   - docker
  needs:
    - acraidentity_prod
  script:
    - |
      sshpass -p "$PROD_SSH_PASSWORD" ssh -o StrictHostKeyChecking=no devops@$dockrunner <<EOF
      docker login $NEXUS_HOST -u "$NEXUS_USER" -p "$NEXUS_PASSWORD"
      docker pull $NEXUS_HOST/$PROD_IDENTITY:$CI_PIPELINE_ID
      docker stop $PROD_IMAGE_IDENTITY || true
      docker rm $PROD_IMAGE_IDENTITY || true
      docker run -d \
      --name $PROD_IMAGE_IDENTITY \
      --network $PROD_NETWORK \
      --restart always \
      -p $PROD_PORT_6:$PROD_PORT_6 \
      -v /etc/localtime:/etc/localtime:ro \
      -v /etc/timezone:/etc/timezone:ro \
      -v /opt/acra/settings/identity-prod/appsettings.json:/app/appsettings.json:ro \
      $NEXUS_HOST/$PROD_IDENTITY:$CI_PIPELINE_ID
      
      echo "Waiting for container to initialize..."
      sleep 10
      if docker ps --format "table {{.Names}}\t{{.Status}}" | grep -q "$PROD_IMAGE_IDENTITY.*Up"; then
        echo "Container $PROD_IMAGE_IDENTITY is running"
        echo "Recent logs:"
        docker logs --tail 20 $PROD_IMAGE_IDENTITY
      else
        echo "Container $PROD_IMAGE_IDENTITY failed to start"
        echo "Container status:"
        docker ps -a --filter name=$PROD_IMAGE_IDENTITY
        echo "Container logs:"
        docker logs $PROD_IMAGE_IDENTITY
        exit 1
      fi
      EOF