stages:
- build
- deploy

variables:
# Nexus repo
  NEXUS_HOST: nexus:8123
# Development
  DEV_NETWORK: acra_dev_docker_net
  DEV_ACRAID: dev-acra-id/acraid
  DEV_IMAGE_ID: acraid-dev
  DEV_PORT_5: 9080
# Production
  PROD_NETWORK: prod_docker_net
  PROD_ACRAID: prod-acra-id/acraid
  PROD_IMAGE_ID: acraid-prod
  PROD_PORT_5: 9080

########### ACRA ID ###########

########### Development ###########
#----------  BUILD  ----------#

acraid_dev:
  stage: build
  only:
    - "develop"
  tags:
   - "multirunner-1"
   - docker
  script:
    - sleep 5
    - docker login $NEXUS_HOST -u "$NEXUS_USER" -p "$NEXUS_PASSWORD"
    - docker build --no-cache -f devops/Dockerfile-acraid . -t $NEXUS_HOST/$DEV_ACRAID:$CI_PIPELINE_ID
    - docker push $NEXUS_HOST/$DEV_ACRAID:$CI_PIPELINE_ID

#----------  DEPLOY  ----------#

deploy_acraid_dev:
  stage: deploy
  only:
    - "develop"
  tags:
   - "multirunner-1"
   - docker
  needs:
    - acraid_dev
  script:
    - |
      sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no devops@$devrunner <<EOF
      docker login $NEXUS_HOST -u "$NEXUS_USER" -p "$NEXUS_PASSWORD"
      docker pull $NEXUS_HOST/$DEV_ACRAID:$CI_PIPELINE_ID
      docker stop $DEV_IMAGE_ID || true
      docker rm $DEV_IMAGE_ID || true
      docker run -d \
        --name $DEV_IMAGE_ID \
        --network $DEV_NETWORK \
        --restart always \
        -p $DEV_PORT_5:$DEV_PORT_5 \
        -v /etc/localtime:/etc/localtime:ro \
        -v /etc/timezone:/etc/timezone:ro \
        -v /opt/acra/settings/acraid-dev/appsettings.json:/app/appsettings.json:ro \
        $NEXUS_HOST/$DEV_ACRAID:$CI_PIPELINE_ID
      
      echo "Waiting for container to initialize..."
      sleep 10
      if docker ps --format "table {{.Names}}\t{{.Status}}" | grep -q "$DEV_IMAGE_ID.*Up"; then
        echo "Container $DEV_IMAGE_ID is running"
        echo "Recent logs:"
        docker logs --tail 20 $DEV_IMAGE_ID
      else
        echo "Container $DEV_IMAGE_ID failed to start"
        echo "Container status:"
        docker ps -a --filter name=$DEV_IMAGE_ID
        echo "Container logs:"
        docker logs $DEV_IMAGE_ID
        exit 1
      fi
      EOF

########### Production ###########
#----------  BUILD  ----------#

acraid_prod:
  stage: build
  only:
    - "master"
  tags:
   - "multirunner-1"
   - docker
  script:
    - sleep 5
    - docker login $NEXUS_HOST -u "$NEXUS_USER" -p "$NEXUS_PASSWORD"
    - docker build --no-cache -f devops/Dockerfile-acraid . -t $NEXUS_HOST/$PROD_ACRAID:$CI_PIPELINE_ID
    - docker push $NEXUS_HOST/$PROD_ACRAID:$CI_PIPELINE_ID

#----------  DEPLOY  ----------#

deploy_acraid_prod:
  stage: deploy
  only:
    - "master"
  tags:
   - "multirunner-1"
   - docker
  needs:
    - acraid_prod
  script:
    - |
      sshpass -p "$PROD_SSH_PASSWORD" ssh -o StrictHostKeyChecking=no devops@$dockrunner <<EOF
      docker login $NEXUS_HOST -u "$NEXUS_USER" -p "$NEXUS_PASSWORD"
      docker pull $NEXUS_HOST/$PROD_ACRAID:$CI_PIPELINE_ID
      docker stop $PROD_IMAGE_ID || true
      docker rm $PROD_IMAGE_ID || true
      docker run -d \
        --name $PROD_IMAGE_ID \
        --network $PROD_NETWORK \
        --restart always \
        -p $PROD_PORT_5:$PROD_PORT_5 \
        -v /etc/localtime:/etc/localtime:ro \
        -v /etc/timezone:/etc/timezone:ro \
        -v /opt/acra/settings/acraid-prod/appsettings.json:/app/appsettings.json:ro \
        $NEXUS_HOST/$PROD_ACRAID:$CI_PIPELINE_ID
      
      echo "Waiting for container to initialize..."
      sleep 10
      if docker ps --format "table {{.Names}}\t{{.Status}}" | grep -q "$PROD_IMAGE_ID.*Up"; then
        echo "Container $PROD_IMAGE_ID is running"
        echo "Recent logs:"
        docker logs --tail 20 $PROD_IMAGE_ID
      else
        echo "Container $PROD_IMAGE_ID failed to start"
        echo "Container status:"
        docker ps -a --filter name=$PROD_IMAGE_ID
        echo "Container logs:"
        docker logs $PROD_IMAGE_ID
        exit 1
      fi
      EOF